<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Check</title>
  <style>
    :root {
      --bg: #111827;
      --bg-surface: #1f2937;
      --bg-card: #374151;
      --bg-card-hover: #3f4a5c;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --text-bright: #f9fafb;
      --border: #374151;
      --border-light: #4b5563;
      --accent: #60a5fa;
      --accent-dim: rgba(96,165,250,0.15);

      --green: #34d399;
      --green-bg: rgba(52,211,153,0.12);
      --green-border: rgba(52,211,153,0.3);
      --yellow: #fbbf24;
      --yellow-bg: rgba(251,191,36,0.12);
      --yellow-border: rgba(251,191,36,0.3);
      --red: #f87171;
      --red-bg: rgba(248,113,113,0.12);
      --red-border: rgba(248,113,113,0.3);
      --blue: #60a5fa;
      --blue-bg: rgba(96,165,250,0.12);
      --blue-border: rgba(96,165,250,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* -- Report Picker -- */
    .report-picker {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .picker-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .picker-label {
      font-size: 13px;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .quarter-select {
      background: var(--bg-card);
      border: 2px solid var(--border-light);
      color: var(--text-bright);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .quarter-select:hover,
    .quarter-select:focus {
      border-color: var(--accent);
      outline: none;
    }
    .picker-months {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .month-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-dim);
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }
    .month-chip:hover {
      color: var(--text-bright);
      border-color: var(--accent);
    }
    .month-chip.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .picker-note {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: auto;
      font-style: italic;
    }

    /* -- Header -- */
    .page-header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }
    .page-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 4px;
    }
    .header-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 8px;
    }
    .meta-chip {
      font-size: 13px;
      color: var(--text-dim);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 6px;
    }
    .meta-chip strong { color: var(--text); }

    /* -- Sections -- */
    .section {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .section-number {
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-bright);
    }
    .section-body { padding: 20px; }
    .section-body p { margin-bottom: 12px; }
    .section-body p:last-child { margin-bottom: 0; }

    /* -- Executive Summary -- */
    .confidence-signal {
      background: var(--bg-card);
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin-top: 16px;
      font-weight: 500;
      color: var(--text-bright);
    }
    .callout {
      background: var(--yellow-bg);
      border: 1px solid var(--yellow-border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 14px;
      color: var(--yellow);
    }

    /* -- Goal Summary Table -- */
    .goal-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .goal-table th {
      text-align: left;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-light);
    }
    .goal-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .goal-table tr:last-child td { border-bottom: none; }
    .goal-table .goal-num { width: 32px; color: var(--text-dim); font-weight: 600; }
    .goal-table .goal-name { color: var(--text-bright); font-weight: 500; }
    .goal-table .goal-notes { color: var(--text-dim); font-size: 13px; }

    /* -- Status Badges -- */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .badge-on-track { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .badge-at-risk { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .badge-completed { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
    .badge-will-not-complete { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .badge-no-plan { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

    /* -- Goal Breakdown Cards -- */
    .goal-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .goal-card:last-child { margin-bottom: 0; }
    .goal-card:hover { border-color: var(--border-light); }
    .goal-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-card);
      transition: background 0.1s;
    }
    .goal-card-header:hover { background: var(--bg-card-hover); }
    .goal-card-arrow {
      color: var(--text-dim);
      font-size: 10px;
      transition: transform 0.2s;
      width: 14px;
      flex-shrink: 0;
    }
    .goal-card.collapsed .goal-card-arrow { transform: rotate(-90deg); }
    .goal-card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-bright);
      flex: 1;
    }
    .goal-card-body {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.7;
    }
    .goal-card.collapsed .goal-card-body { display: none; }
    .goal-card-body h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 16px;
      margin-bottom: 6px;
    }
    .goal-card-body h4:first-child { margin-top: 0; }
    .goal-card-body ul {
      margin: 0 0 8px 20px;
      color: var(--text);
    }
    .goal-card-body li { margin-bottom: 4px; }
    .goal-card-body p { margin-bottom: 8px; }
    .goal-card-body .action-needed {
      background: var(--yellow-bg);
      border: 1px solid var(--yellow-border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 8px;
      color: var(--yellow);
      font-size: 13px;
    }

    /* -- Team Table -- */
    .team-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .team-table th {
      text-align: left;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-light);
    }
    .team-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .team-table tr:last-child td { border-bottom: none; }
    .team-total {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 4px;
    }
    .team-total-label {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    /* -- Health -- */
    .health-block {
      margin-bottom: 16px;
    }
    .health-block:last-child { margin-bottom: 0; }
    .health-block h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 6px;
    }
    .health-block ul {
      margin: 0 0 0 20px;
      font-size: 14px;
    }
    .health-block li { margin-bottom: 6px; }
    .health-note {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
    }

    /* -- Risks -- */
    .risk-group { margin-bottom: 20px; }
    .risk-group:last-child { margin-bottom: 0; }
    .risk-group-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .risk-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .risk-group ul {
      margin: 0 0 0 20px;
      font-size: 14px;
    }
    .risk-group li { margin-bottom: 8px; }
    .ask-item {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }
    .ask-item:last-child { margin-bottom: 0; }
    .ask-item strong { color: var(--text-bright); }
    .ask-item .ask-action {
      font-size: 13px;
      color: var(--accent);
      margin-top: 4px;
      font-style: italic;
    }

    /* -- Footer -- */
    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .source-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .source-table th {
      text-align: left;
      padding: 6px 10px;
      color: var(--text-dim);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .source-table td {
      padding: 6px 10px;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
    }
    .source-table tr:last-child td { border-bottom: none; }
    .footer-note {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 16px;
    }

    /* -- Expand/Collapse All -- */
    .toggle-all {
      background: none;
      border: 1px solid var(--border-light);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .toggle-all:hover { color: var(--text-bright); border-color: var(--accent); }
    .section-header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    /* -- Loading -- */
    .loading {
      text-align: center;
      color: var(--text-dim);
      padding: 60px 20px;
      font-size: 14px;
    }
    .load-error {
      text-align: center;
      color: var(--red);
      padding: 60px 20px;
      font-size: 14px;
    }

    /* -- Print -- */
    @media print {
      body { background: #fff; color: #111; padding: 12px; max-width: none; }
      .report-picker { display: none; }
      .section { border-color: #ddd; background: #fff; }
      .goal-card { border-color: #ddd; }
      .goal-card-header { background: #f5f5f5; }
      .goal-card-body { display: block !important; }
      .goal-card-arrow, .toggle-all { display: none; }
      :root {
        --bg: #fff; --bg-surface: #fff; --bg-card: #f8f8f8;
        --text: #111; --text-dim: #555; --text-bright: #000;
        --border: #ddd; --border-light: #ccc;
      }
    }
  </style>
</head>
<body>

  <div id="picker"></div>
  <div id="app"><div class="loading">Loading...</div></div>

  <script>
    // ── Index (inline for file:// compatibility) ──
    // Also try loading external file for forward-compat
    var PULSE_CHECK_INDEX = [
      {
        id: "2026-04",
        quarter: "Q2 2026",
        month: "April 2026",
        month_short: "Apr",
        milestone: "M&Ms",
        generated: "2026-04-08",
        file: "pulse_check_2026-04_data.js",
        note: "Proxy goals (Q2 QVR goals not set)"
      },
      {
        id: "2026-03",
        quarter: "Q1 2026",
        month: "March 2026",
        month_short: "Mar",
        milestone: "Systems Validation",
        generated: "2026-03-25",
        file: "pulse_check_2026-03_data.js",
        note: ""
      }
    ];
  </script>
  <script src="pulse_check_index.js"></script>
  <script>
    // ── State ──
    var currentReportId = null;
    var currentQuarter = null;
    var loadedData = {};

    // ── Helpers ──
    function esc(str) {
      var d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function badgeClass(status) {
      var map = {
        'on_track': 'badge-on-track',
        'at_risk': 'badge-at-risk',
        'completed': 'badge-completed',
        'will_not_complete': 'badge-will-not-complete',
        'no_plan': 'badge-no-plan'
      };
      return map[status] || 'badge-on-track';
    }

    function badgeLabel(status) {
      var map = {
        'on_track': 'On Track',
        'at_risk': 'At Risk',
        'completed': 'Completed',
        'will_not_complete': 'Will Not Complete',
        'no_plan': 'No Plan'
      };
      return map[status] || status;
    }

    function toggleCard(el) {
      el.closest('.goal-card').classList.toggle('collapsed');
    }

    function toggleAll(expand) {
      document.querySelectorAll('.goal-card').forEach(function(c) {
        if (expand) c.classList.remove('collapsed');
        else c.classList.add('collapsed');
      });
    }

    // ── Quarter helpers ──
    function getQuarterMap() {
      var quarters = {};
      PULSE_CHECK_INDEX.forEach(function(entry) {
        if (!quarters[entry.quarter]) quarters[entry.quarter] = [];
        quarters[entry.quarter].push(entry);
      });
      return quarters;
    }

    function getSortedQuarters() {
      return Object.keys(getQuarterMap()).sort().reverse();
    }

    // ── Picker ──
    function renderPicker() {
      var pickerEl = document.getElementById('picker');

      if (!PULSE_CHECK_INDEX || PULSE_CHECK_INDEX.length === 0) {
        pickerEl.innerHTML = '<div class="report-picker"><span style="color:var(--text-dim)">No reports available.</span></div>';
        return;
      }

      var quarters = getQuarterMap();
      var sortedQ = getSortedQuarters();

      if (!currentQuarter || !quarters[currentQuarter]) {
        currentQuarter = sortedQ[0];
      }

      // Build quarter <option>s
      var optionsHtml = '';
      for (var i = 0; i < sortedQ.length; i++) {
        var q = sortedQ[i];
        var sel = (q === currentQuarter) ? ' selected' : '';
        var cnt = quarters[q].length;
        optionsHtml += '<option value="' + esc(q) + '"' + sel + '>' + esc(q) + ' (' + cnt + ' report' + (cnt !== 1 ? 's' : '') + ')</option>';
      }

      // Build month chips for selected quarter
      var entries = quarters[currentQuarter];
      var chipsHtml = '';
      for (var j = 0; j < entries.length; j++) {
        var e = entries[j];
        var tooltip = e.month + ' - ' + e.milestone;
        if (e.note) tooltip += ' (' + e.note + ')';
        chipsHtml += '<button class="month-chip" data-id="' + esc(e.id) + '" onclick="loadReport(\'' + esc(e.id) + '\')" title="' + esc(tooltip) + '">' + esc(e.month_short) + '</button>';
      }

      pickerEl.innerHTML =
        '<div class="report-picker">' +
          '<div class="picker-row">' +
            '<span class="picker-label">Quarter</span>' +
            '<select class="quarter-select" onchange="selectQuarter(this.value)">' + optionsHtml + '</select>' +
            '<span class="picker-label" style="margin-left:8px">Month</span>' +
            '<div class="picker-months">' + chipsHtml + '</div>' +
          '</div>' +
        '</div>';

      highlightActiveChip();
    }

    function selectQuarter(quarter) {
      currentQuarter = quarter;
      renderPicker();

      // Auto-load the most recent report in this quarter
      var quarters = getQuarterMap();
      if (quarters[quarter] && quarters[quarter].length > 0) {
        loadReport(quarters[quarter][0].id);
      }
    }

    function highlightActiveChip() {
      var chips = document.querySelectorAll('.month-chip');
      for (var i = 0; i < chips.length; i++) {
        if (chips[i].getAttribute('data-id') === currentReportId) {
          chips[i].classList.add('active');
        } else {
          chips[i].classList.remove('active');
        }
      }
    }

    // ── Report Loading ──
    function loadReport(id) {
      currentReportId = id;
      highlightActiveChip();

      if (loadedData[id]) {
        renderReport(loadedData[id]);
        return;
      }

      document.getElementById('app').innerHTML = '<div class="loading">Loading report...</div>';

      var entry = null;
      for (var i = 0; i < PULSE_CHECK_INDEX.length; i++) {
        if (PULSE_CHECK_INDEX[i].id === id) { entry = PULSE_CHECK_INDEX[i]; break; }
      }
      if (!entry) {
        document.getElementById('app').innerHTML = '<div class="load-error">Report "' + esc(id) + '" not found in index.</div>';
        return;
      }

      var script = document.createElement('script');
      script.src = entry.file;
      script.onload = function() {
        if (window.PULSE_CHECK_DATA) {
          loadedData[id] = window.PULSE_CHECK_DATA;
          renderReport(window.PULSE_CHECK_DATA);
        } else {
          document.getElementById('app').innerHTML = '<div class="load-error">Data file loaded but contained no data.</div>';
        }
      };
      script.onerror = function() {
        document.getElementById('app').innerHTML = '<div class="load-error">Failed to load <code>' + esc(entry.file) + '</code>.<br>If viewing locally, try serving with a local server (e.g. <code>npx serve .</code>).</div>';
      };
      document.head.appendChild(script);
    }

    // ── Render Report ──
    function renderReport(d) {
      if (!d) {
        document.getElementById('app').innerHTML = '<div class="loading">Select a report above.</div>';
        return;
      }

      var m = d.meta;

      // Goal summary table rows
      var goalRows = d.goals.map(function(g) {
        return '<tr>' +
          '<td class="goal-num">' + g.number + '</td>' +
          '<td class="goal-name">' + esc(g.title) + '</td>' +
          '<td><span class="badge ' + badgeClass(g.status) + '">' + badgeLabel(g.status) + '</span></td>' +
          '<td>' + esc(g.confidence) + '</td>' +
          '<td class="goal-notes">' + esc(g.summary_notes) + '</td>' +
        '</tr>';
      }).join('');

      // Goal breakdown cards
      var goalCards = d.goals.map(function(g) {
        return '<div class="goal-card collapsed">' +
          '<div class="goal-card-header" onclick="toggleCard(this)">' +
            '<span class="goal-card-arrow">&#9660;</span>' +
            '<span class="badge ' + badgeClass(g.status) + '">' + badgeLabel(g.status) + '</span>' +
            '<span class="goal-card-title">Goal ' + g.number + ': ' + esc(g.title) + '</span>' +
          '</div>' +
          '<div class="goal-card-body">' + g.breakdown + '</div>' +
        '</div>';
      }).join('');

      // Team disciplines table
      var teamRows = d.team_size.disciplines.map(function(t) {
        return '<tr>' +
          '<td style="color:var(--text-bright);font-weight:500">' + esc(t.name) + '</td>' +
          '<td style="font-weight:600">' + t.count + '</td>' +
          '<td style="color:var(--text-dim);font-size:13px">' + esc(t.notes) + '</td>' +
        '</tr>';
      }).join('');

      // Team changes
      var changesHtml = d.team_size.changes.length > 0
        ? '<ul>' + d.team_size.changes.map(function(c) { return '<li>' + c + '</li>'; }).join('') + '</ul>'
        : '<p style="color:var(--text-dim)">No open roles or team changes this period.</p>';

      // Health
      var highlightsHtml = d.team_health.highlights.map(function(h) { return '<li>' + h + '</li>'; }).join('');
      var concernsHtml = d.team_health.concerns.map(function(c) { return '<li>' + c + '</li>'; }).join('');

      // Risks
      var blockersHtml = d.blockers_risks.blockers.length > 0
        ? '<ul>' + d.blockers_risks.blockers.map(function(b) { return '<li>' + b + '</li>'; }).join('') + '</ul>'
        : '<p style="color:var(--text-dim)">No active blockers.</p>';

      var risksHtml = d.blockers_risks.risks.map(function(r) { return '<li>' + r + '</li>'; }).join('');

      var asksHtml = d.blockers_risks.needs_asks.map(function(a) {
        return '<div class="ask-item">' +
          '<strong>' + a.title + '</strong>' +
          '<p style="margin:4px 0 0;font-size:14px">' + a.detail + '</p>' +
          (a.ask ? '<div class="ask-action">' + esc(a.ask) + '</div>' : '') +
        '</div>';
      }).join('');

      var questionsHtml = d.blockers_risks.open_questions.map(function(q) { return '<li>' + q + '</li>'; }).join('');

      // Data sources
      var sourceRows = d.data_sources.map(function(s) {
        return '<tr>' +
          '<td style="color:var(--text)">' + esc(s.source) + '</td>' +
          '<td>' + esc(s.date) + '</td>' +
          '<td>' + esc(s.notes) + '</td>' +
        '</tr>';
      }).join('');

      document.getElementById('app').innerHTML =
        '<div class="page-header">' +
          '<h1>Pulse Check &mdash; ' + esc(m.month) + '</h1>' +
          '<div class="header-meta">' +
            '<span class="meta-chip"><strong>' + esc(m.quarter) + '</strong></span>' +
            '<span class="meta-chip">Milestone: <strong>' + esc(m.milestone) + '</strong></span>' +
            '<span class="meta-chip">Generated: <strong>' + esc(m.generated) + '</strong></span>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-header">' +
            '<span class="section-number">1</span>' +
            '<span class="section-title">Executive Summary</span>' +
          '</div>' +
          '<div class="section-body">' + d.executive_summary + '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-header">' +
            '<span class="section-number">2</span>' +
            '<span class="section-title">Goal Summary</span>' +
          '</div>' +
          '<div class="section-body" style="padding:0">' +
            '<table class="goal-table">' +
              '<thead><tr><th>#</th><th>Goal</th><th>Status</th><th>Confidence</th><th>Notes</th></tr></thead>' +
              '<tbody>' + goalRows + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-header">' +
            '<span class="section-number">3</span>' +
            '<span class="section-title">Goal Breakdown</span>' +
            '<div class="section-header-actions">' +
              '<button class="toggle-all" onclick="toggleAll(true)">Expand All</button>' +
              '<button class="toggle-all" onclick="toggleAll(false)">Collapse All</button>' +
            '</div>' +
          '</div>' +
          '<div class="section-body">' + goalCards + '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-header">' +
            '<span class="section-number">4</span>' +
            '<span class="section-title">Team Size</span>' +
          '</div>' +
          '<div class="section-body">' +
            '<div class="team-total">' + d.team_size.total + '</div>' +
            '<div class="team-total-label">Total Team Members</div>' +
            '<table class="team-table">' +
              '<thead><tr><th>Discipline</th><th>Count</th><th>Notes</th></tr></thead>' +
              '<tbody>' + teamRows + '</tbody>' +
            '</table>' +
            '<h4 style="font-size:14px;color:var(--text-bright);margin-top:20px;margin-bottom:8px">Notable Team Changes</h4>' +
            changesHtml +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-header">' +
            '<span class="section-number">5</span>' +
            '<span class="section-title">Team Health</span>' +
          '</div>' +
          '<div class="section-body">' +
            '<p>' + d.team_health.assessment + '</p>' +
            '<div class="health-block"><h4>Highlights</h4><ul>' + highlightsHtml + '</ul></div>' +
            '<div class="health-block"><h4>Concerns</h4><ul>' + concernsHtml + '</ul></div>' +
            '<div class="health-note">' + (d.team_health.note || '') + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="section">' +
          '<div class="section-header">' +
            '<span class="section-number">6</span>' +
            '<span class="section-title">Blockers, Risks, Needs &amp; Asks</span>' +
          '</div>' +
          '<div class="section-body">' +
            '<div class="risk-group">' +
              '<div class="risk-group-title"><span class="risk-dot" style="background:var(--red)"></span> Active Blockers</div>' +
              blockersHtml +
            '</div>' +
            '<div class="risk-group">' +
              '<div class="risk-group-title"><span class="risk-dot" style="background:var(--yellow)"></span> Top Risks</div>' +
              '<ul>' + risksHtml + '</ul>' +
            '</div>' +
            '<div class="risk-group">' +
              '<div class="risk-group-title"><span class="risk-dot" style="background:var(--accent)"></span> Needs &amp; Asks</div>' +
              asksHtml +
            '</div>' +
            '<div class="risk-group">' +
              '<div class="risk-group-title"><span class="risk-dot" style="background:var(--text-dim)"></span> Open Questions</div>' +
              '<ul>' + questionsHtml + '</ul>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="footer">' +
          '<table class="source-table">' +
            '<thead><tr><th>Data Source</th><th>Date</th><th>Notes</th></tr></thead>' +
            '<tbody>' + sourceRows + '</tbody>' +
          '</table>' +
          '<div class="footer-note">Generated by /generatePulseCheckReport</div>' +
        '</div>';
    }

    // ── Init ──
    try {
      if (PULSE_CHECK_INDEX && PULSE_CHECK_INDEX.length > 0) {
        currentQuarter = PULSE_CHECK_INDEX[0].quarter;
        renderPicker();
        loadReport(PULSE_CHECK_INDEX[0].id);
      } else {
        renderPicker();
        document.getElementById('app').innerHTML = '<div class="loading">No Pulse Check reports found. Run <code>/generatePulseCheckReport</code> to create one.</div>';
      }
    } catch (err) {
      document.getElementById('picker').innerHTML = '<div class="load-error">Error initializing: ' + err.message + '</div>';
    }
  </script>
</body>
</html>
