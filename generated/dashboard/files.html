<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files - Lotus Tools</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-panel: #16213e;
      --bg-card: #0f3460;
      --bg-row-alt: #1a2744;
      --text: #e0e0e0;
      --text-dim: #8899aa;
      --text-bright: #ffffff;
      --border: #2a3a5e;
      --accent: #53a8ff;

      --pod-empire: #4A9EFF;
      --pod-metagame: #FF8C42;
      --pod-battle: #FF4444;
      --pod-social: #44BB77;
      --pod-dozer: #AA77FF;
      --pod-art: #FFD700;

      --status-green: #22c55e;
      --status-yellow: #eab308;
      --status-gray: #6b7280;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    code, .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }

    /* ── Nav Bar ── */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .nav-brand {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .nav-links { display: flex; gap: 4px; }
    .nav-link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 6px;
      transition: all 0.15s;
    }
    .nav-link:hover { color: var(--text-bright); background: rgba(83,168,255,0.1); }
    .nav-link.active { color: var(--accent); background: rgba(83,168,255,0.15); font-weight: 600; }
    .nav-repo { font-size: 12px; }

    /* ── Header ── */
    .header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }
    .header h1 { font-size: 26px; color: var(--text-bright); margin-bottom: 4px; }
    .header .subtitle { color: var(--text-dim); font-size: 13px; }
    .last-updated {
      display: inline-block;
      background: rgba(83, 168, 255, 0.12);
      border: 1px solid rgba(83, 168, 255, 0.35);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
      letter-spacing: 0.2px;
    }

    /* ── Search ── */
    .search-wrap {
      margin-bottom: 20px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px 10px 38px;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-dim); }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 16px;
      pointer-events: none;
    }
    .search-count {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 12px;
    }

    /* ── Sections ── */
    .section {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .section.hidden { display: none; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .section-header:hover { background: rgba(83,168,255,0.04); }
    .section-left { display: flex; align-items: center; gap: 10px; }
    .section-arrow {
      color: var(--text-dim);
      font-size: 10px;
      transition: transform 0.2s;
      width: 14px;
    }
    .section.collapsed .section-arrow { transform: rotate(-90deg); }
    .section-name { font-size: 16px; font-weight: 600; color: var(--text-bright); }
    .section-desc { font-size: 12px; color: var(--text-dim); }
    .section-count {
      font-size: 11px;
      color: var(--text-dim);
      background: rgba(107,114,128,0.2);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .section-body { padding: 0 20px 16px 20px; }
    .section.collapsed .section-body { display: none; }

    /* ── Subsections ── */
    .subsection {
      margin-top: 12px;
      border: 1px solid rgba(42,58,94,0.5);
      border-radius: 8px;
      overflow: hidden;
    }
    .subsection-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      user-select: none;
      background: rgba(15,52,96,0.3);
    }
    .subsection-header:hover { background: rgba(83,168,255,0.06); }
    .subsection.collapsed .subsection-body { display: none; }
    .subsection.collapsed .sub-arrow { transform: rotate(-90deg); }
    .sub-arrow { color: var(--text-dim); font-size: 9px; transition: transform 0.2s; width: 12px; }
    .sub-name { font-size: 14px; font-weight: 600; color: var(--text-bright); }
    .pod-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .subsection-body { padding: 4px 0; }

    /* ── File Rows ── */
    .file-row {
      display: flex;
      align-items: center;
      padding: 6px 14px;
      text-decoration: none;
      color: var(--text);
      transition: background 0.1s;
      gap: 10px;
      border-bottom: 1px solid rgba(42,58,94,0.2);
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: rgba(83,168,255,0.06); }
    .file-icon { color: var(--text-dim); font-size: 14px; flex-shrink: 0; width: 18px; text-align: center; }
    .file-label { font-size: 13px; color: var(--accent); font-weight: 500; min-width: 180px; }
    .file-desc { font-size: 12px; color: var(--text-dim); flex: 1; }
    .file-path { font-size: 11px; color: var(--text-dim); opacity: 0.6; font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    .file-row:hover .file-path { opacity: 1; }

    .pod-tag {
      display: inline-block;
      padding: 0 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 600;
      color: #111;
      flex-shrink: 0;
    }

    .file-row.search-highlight { background: rgba(83,168,255,0.08); }

    /* ── Footer ── */
    .footer {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      padding: 16px 0;
    }

    .no-results {
      text-align: center;
      color: var(--text-dim);
      padding: 32px;
      font-size: 14px;
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; color: #111; padding: 12px; }
      .top-nav, .search-wrap { display: none; }
      .section { border-color: #ccc; }
      :root {
        --bg: #fff; --bg-panel: #f8f8f8; --bg-card: #f0f0f0;
        --text: #111; --text-dim: #555; --text-bright: #000; --border: #ccc;
      }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <span class="nav-brand">Lotus Tools</span>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Production Dashboard</a>
      <a href="sprint.html" class="nav-link">Sprint Plan</a>
      <a href="roadmap.html" class="nav-link">Roadmap</a>
      <a href="validation.html" class="nav-link">Validation</a>
      <a href="files.html" class="nav-link active">Files</a>
      <a href="../dashboard_v2/index.html" class="nav-link" target="_blank" rel="noopener" style="background:rgba(234,179,8,0.15);color:#eab308;" title="Productionomicon 2 — picon">picon ↗</a>
    </div>
    <a href="https://github.com/timwilliams-prod/proj-chimera-documentation-brain/tree/main" class="nav-link nav-repo" target="_blank" rel="noopener">GitHub &nearr;</a>
  </nav>

  <div id="app"></div>

  <script src="files_data.js"></script>
  <script>
    const POD_COLORS = {
      'Empire': '#4A9EFF', 'Metagame': '#FF8C42', 'Battle': '#FF4444',
      'Social Dynamics': '#44BB77', 'Dozer': '#AA77FF', 'Art': '#FFD700'
    };

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function podTag(pod) {
      if (!pod) return '';
      const color = POD_COLORS[pod] || '#888';
      return `<span class="pod-tag" style="background:${color}">${esc(pod)}</span>`;
    }

    function fileUrl(path) {
      return `${FILES_DATA.repo_base}/${path}`;
    }

    function renderFileRow(f) {
      return `
        <a class="file-row" href="${fileUrl(f.path)}" target="_blank" rel="noopener"
           data-label="${esc(f.label).toLowerCase()}" data-path="${esc(f.path).toLowerCase()}"
           data-desc="${esc(f.desc || '').toLowerCase()}">
          <span class="file-icon">&#128196;</span>
          <span class="file-label">${esc(f.label)}</span>
          ${f.pod ? podTag(f.pod) : ''}
          <span class="file-desc">${esc(f.desc || '')}</span>
          <span class="file-path">${esc(f.path)}</span>
        </a>
      `;
    }

    function countFiles(section) {
      let n = 0;
      if (section.files) n += section.files.length;
      if (section.subsections) {
        section.subsections.forEach(sub => { n += sub.files.length; });
      }
      return n;
    }

    function renderSection(section) {
      const count = countFiles(section);
      let body = '';

      if (section.subsections) {
        body = section.subsections.map(sub => {
          const podColor = POD_COLORS[sub.pod || sub.name] || '#888';
          const files = sub.files.map(renderFileRow).join('');
          return `
            <div class="subsection" data-subsection>
              <div class="subsection-header" onclick="this.parentElement.classList.toggle('collapsed')">
                <span class="sub-arrow">&#9660;</span>
                <span class="pod-dot" style="background:${podColor}"></span>
                <span class="sub-name">${esc(sub.name)}</span>
                <span class="section-count">${sub.files.length}</span>
              </div>
              <div class="subsection-body">${files}</div>
            </div>
          `;
        }).join('');
      }

      if (section.files) {
        body += section.files.map(renderFileRow).join('');
      }

      return `
        <div class="section" data-section="${section.id}" id="section-${section.id}">
          <div class="section-header" onclick="this.parentElement.classList.toggle('collapsed')">
            <div class="section-left">
              <span class="section-arrow">&#9660;</span>
              <span class="section-name">${esc(section.name)}</span>
              <span class="section-desc">${esc(section.desc || '')}</span>
            </div>
            <span class="section-count">${count} files</span>
          </div>
          <div class="section-body">${body}</div>
        </div>
      `;
    }

    function render() {
      if (typeof FILES_DATA === 'undefined') {
        document.getElementById('app').innerHTML =
          '<div class="no-results">No file data loaded.</div>';
        return;
      }

      const totalFiles = FILES_DATA.sections.reduce((n, s) => n + countFiles(s), 0);
      const filesGenLabel = new Date(FILES_DATA.generated_at.includes('T') ? FILES_DATA.generated_at : FILES_DATA.generated_at + 'T00:00:00').toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      document.getElementById('app').innerHTML = `
        <div class="header">
          <h1>Project Files</h1>
          <div class="subtitle">${totalFiles} files across planning, features, and generated output &middot; Links open on GitHub</div>
          <div class="last-updated">Last Updated: ${filesGenLabel}</div>
        </div>
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input type="text" class="search-input" id="search" placeholder="Search files..." oninput="filterFiles(this.value)">
          <span class="search-count" id="search-count"></span>
        </div>
        ${FILES_DATA.sections.map(renderSection).join('')}
        <div class="footer">File tree generated ${FILES_DATA.generated_at} &middot; Regenerate when files are added or removed</div>
      `;
    }

    function filterFiles(query) {
      const q = query.toLowerCase().trim();
      const rows = document.querySelectorAll('.file-row');
      const sections = document.querySelectorAll('.section');
      const subsections = document.querySelectorAll('[data-subsection]');
      let visible = 0;

      if (!q) {
        // Reset: show everything, restore collapsed state
        rows.forEach(r => { r.style.display = ''; r.classList.remove('search-highlight'); });
        sections.forEach(s => { s.classList.remove('hidden'); });
        subsections.forEach(s => { s.style.display = ''; });
        document.getElementById('search-count').textContent = '';
        return;
      }

      // Filter rows
      rows.forEach(r => {
        const match = r.dataset.label.includes(q) || r.dataset.path.includes(q) || r.dataset.desc.includes(q);
        r.style.display = match ? '' : 'none';
        r.classList.toggle('search-highlight', match);
        if (match) visible++;
      });

      // Show/hide sections based on whether they have visible rows
      sections.forEach(s => {
        const hasVisible = s.querySelectorAll('.file-row:not([style*="display: none"])').length > 0;
        s.classList.toggle('hidden', !hasVisible);
        if (hasVisible) s.classList.remove('collapsed');
      });

      // Show/hide subsections
      subsections.forEach(s => {
        const hasVisible = s.querySelectorAll('.file-row:not([style*="display: none"])').length > 0;
        s.style.display = hasVisible ? '' : 'none';
        if (hasVisible) s.classList.remove('collapsed');
      });

      document.getElementById('search-count').textContent = `${visible} result${visible !== 1 ? 's' : ''}`;
    }

    // Keyboard shortcut: / to focus search
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('search')?.focus();
      }
    });

    render();
  </script>
</body>
</html>
