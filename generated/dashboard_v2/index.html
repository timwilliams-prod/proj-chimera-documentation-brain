<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/webp" href="lotus.webp">
  <title>Lotus Productionomicon 2! (picon)</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-panel: #16213e;
      --bg-card: #0f3460;
      --bg-row-alt: #1a2744;
      --bg-sidebar: #11182b;
      --bg-sidebar-hover: #1a2744;
      --bg-sidebar-active: #0f3460;
      --text: #e0e0e0;
      --text-dim: #8899aa;
      --text-bright: #ffffff;
      --border: #2a3a5e;
      --accent: #53a8ff;
      --accent-strong: #2b78cc;

      --pod-empire: #4A9EFF;
      --pod-metagame: #FF8C42;
      --pod-battle: #FF4444;
      --pod-social: #44BB77;
      --pod-dozer: #AA77FF;
      --pod-art: #FFD700;
      --pod-cross: #888888;

      --status-green: #22c55e;
      --status-yellow: #eab308;
      --status-red: #ef4444;
      --status-blue: #3b82f6;
      --status-gray: #6b7280;

      --sidebar-w: 260px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    code, .mono { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ────────────────────────────────── Sidebar ────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      transition: margin-left 0.2s ease;
    }
    .sidebar.collapsed { margin-left: calc(var(--sidebar-w) * -1); }

    /* Slimmer, darker scrollbar for the sidebar */
    .sidebar { scrollbar-width: thin; scrollbar-color: #2a3a5e transparent; }
    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb {
      background: #2a3a5e;
      border-radius: 3px;
    }
    .sidebar::-webkit-scrollbar-thumb:hover { background: #3a4a72; }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 18px 16px 18px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-sidebar);
      z-index: 10;
    }
    .sidebar-logo {
      width: 38px; height: 38px;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card);
    }
    .sidebar-logo img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .sidebar-brand-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-bright);
      line-height: 1;
      letter-spacing: 2px;
    }
    .sidebar-brand-sub {
      font-size: 10.5px;
      color: var(--text-dim);
      letter-spacing: 0.4px;
      margin-top: 4px;
    }

    .sidebar-section { padding: 16px 0 8px 0; }
    .sidebar-section + .sidebar-section {
      border-top: 1px solid var(--border);
      margin-top: 4px;
    }
    .sidebar-section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--text-bright);
      padding: 0 18px 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-section-title::before {
      content: "";
      width: 3px;
      height: 12px;
      background: var(--accent);
      border-radius: 2px;
      flex-shrink: 0;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 18px;
      color: var(--text);
      font-size: 13.5px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .sidebar-link:hover { background: var(--bg-sidebar-hover); text-decoration: none; }
    .sidebar-link.active {
      background: var(--bg-sidebar-active);
      color: var(--text-bright);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .sidebar-link .pod-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sidebar-link .badge {
      font-size: 10px;
      color: var(--text-dim);
      background: rgba(136,153,170,0.12);
      padding: 1px 6px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }
    .sidebar-link .badge.soon { background: rgba(234,179,8,0.15); color: var(--status-yellow); }

    .sidebar-footer {
      margin-top: auto;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ────────────────────────────────── Main Content ────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      flex-shrink: 0;
    }
    .hamburger {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px; height: 36px;
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: background 0.1s;
    }
    .hamburger:hover { background: var(--bg-sidebar-hover); }

    .topbar-search {
      flex: 1;
      max-width: 480px;
      position: relative;
    }
    .topbar-search input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px 8px 34px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
    .topbar-search input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .topbar-search-icon {
      position: absolute;
      left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }
    .topbar-search-hint {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 10px;
      letter-spacing: 0.5px;
      background: rgba(136,153,170,0.1);
      padding: 2px 6px;
      border-radius: 4px;
      pointer-events: none;
    }
    .search-results {
      position: absolute;
      top: calc(100% + 4px);
      left: 0; right: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 360px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 100;
    }
    .search-result {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .search-result:hover, .search-result.active { background: var(--bg-sidebar-hover); }
    .search-result-section {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .search-result-title { color: var(--text-bright); }
    .search-empty { padding: 16px; color: var(--text-dim); font-size: 13px; text-align: center; }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .preview-tag {
      background: rgba(234,179,8,0.15);
      color: var(--status-yellow);
      border: 1px solid rgba(234,179,8,0.4);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }
    .page-title {
      font-size: 24px;
      color: var(--text-bright);
      font-weight: 600;
    }
    .page-subtitle {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 4px;
    }
    .page-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-subtitle {
      font-size: 12px;
      color: var(--text-dim);
      font-weight: normal;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 1100px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ────────────────────────────────── Buttons ────────────────────────────────── */
    .btn {
      background: var(--bg-card);
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }
    .btn:hover { background: var(--accent-strong); border-color: var(--accent); }
    .btn-primary { background: var(--accent-strong); border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent); }
    .btn-ghost { background: transparent; }
    .btn-ghost:hover { background: var(--bg-sidebar-hover); border-color: var(--border); }
    .btn-danger:hover { background: var(--status-red); border-color: var(--status-red); }

    /* ────────────────────────────────── Tables / cards ────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:nth-child(even) td { background: var(--bg-row-alt); }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .pill-not_started, .pill-not-started, .pill-NOT_STARTED { background: rgba(107,114,128,0.2); color: var(--status-gray); }
    .pill-in_progress, .pill-in-progress, .pill-IN_PROGRESS { background: rgba(59,130,246,0.18); color: var(--status-blue); }
    .pill-complete, .pill-COMPLETE, .pill-done { background: rgba(34,197,94,0.18); color: var(--status-green); }
    .pill-blocked, .pill-BLOCKED { background: rgba(239,68,68,0.18); color: var(--status-red); }
    .pill-pending, .pill-PENDING { background: rgba(234,179,8,0.18); color: var(--status-yellow); }
    .pill-parked, .pill-PARKED { background: rgba(170,119,255,0.18); color: var(--pod-dozer); }

    .pod-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }
    .pod-tag.empire { background: var(--pod-empire); }
    .pod-tag.metagame { background: var(--pod-metagame); }
    .pod-tag.battle { background: var(--pod-battle); }
    .pod-tag.social { background: var(--pod-social); }
    .pod-tag.dozer { background: var(--pod-dozer); }
    .pod-tag.cross { background: var(--pod-cross); }

    /* ────────────────────────────────── Edit mode ────────────────────────────────── */
    .editable[contenteditable="true"] {
      background: rgba(83,168,255,0.08);
      border: 1px dashed var(--accent);
      border-radius: 4px;
      padding: 4px 6px;
      outline: none;
      min-height: 1.5em;
    }
    .editable[contenteditable="true"]:focus {
      background: rgba(83,168,255,0.14);
      border-style: solid;
    }
    .edit-only { display: none; }
    body.edit-mode .edit-only { display: inline-block; }
    body.edit-mode .view-only { display: none; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-card);
      color: var(--text-bright);
      border: 1px solid var(--accent);
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      font-size: 13px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

    /* ────────────────────────────────── Embedded pages ────────────────────────────────── */
    /* The iframe is invisible — embedded pages run in ?embed=1 mode and post their
       content height to the parent so we resize the iframe to fit. The result looks
       like a native v2 page. */
    .embed-host {
      background: transparent;
      border: 0;
      border-radius: 0;
      overflow: visible;
      min-height: 320px;
    }
    .embed-host iframe {
      display: block;
      width: 100%;
      height: 320px; /* initial; resized by postMessage */
      border: 0;
      background: transparent;
    }
    .embed-loading {
      color: var(--text-dim);
      font-size: 13px;
      padding: 12px 0;
    }

    /* ────────────────────────────────── Roadmap (native) ────────────────────────────────── */
    .roadmap-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .roadmap-legend .legend-label {
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .roadmap-legend .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .roadmap-container {
      overflow-x: auto;
      position: relative;
      padding-bottom: 8px;
    }
    .roadmap-grid {
      position: relative;
      min-width: 1900px;
    }
    .roadmap-header {
      display: flex;
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-panel);
    }
    .roadmap-label-col {
      width: 140px;
      min-width: 140px;
      flex-shrink: 0;
      padding: 6px 8px;
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .roadmap-timeline-area { flex: 1; position: relative; }
    .roadmap-months { display: flex; width: 100%; }
    .roadmap-month-col {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      padding: 6px 2px;
      border-left: 1px solid rgba(42, 58, 94, 0.3);
    }
    .roadmap-month-col.current {
      background: rgba(83, 168, 255, 0.08);
      color: var(--accent);
      font-weight: 600;
    }

    .milestone-band-row {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .milestone-band-track {
      flex: 1;
      position: relative;
      height: 28px;
    }
    .milestone-band {
      position: absolute;
      top: 3px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #111;
      overflow: hidden;
      white-space: nowrap;
    }
    .milestone-band.active-ms {
      outline: 2px solid var(--text-bright);
      outline-offset: 1px;
    }

    .roadmap-body { position: relative; }
    .roadmap-row {
      display: flex;
      min-height: 52px;
      border-bottom: 1px solid rgba(42, 58, 94, 0.3);
    }
    .roadmap-row:nth-child(even) { background: rgba(15, 52, 96, 0.15); }
    .roadmap-pod-label {
      width: 140px;
      min-width: 140px;
      flex-shrink: 0;
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
    }
    .roadmap-pod-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .roadmap-track {
      flex: 1;
      position: relative;
      min-height: 52px;
    }

    .boulder-bar {
      position: absolute;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 500;
      color: #111;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
      z-index: 2;
      user-select: none;
      transition: box-shadow 0.1s, transform 0.1s, opacity 0.1s;
    }
    .boulder-bar.future { opacity: 0.55; }
    .boulder-bar:hover {
      opacity: 1;
      z-index: 5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .boulder-bar.is-active {
      outline: 2px solid var(--text-bright);
      outline-offset: 1px;
      opacity: 1;
      z-index: 6;
    }

    .month-gridlines {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
    }
    .month-gridline {
      position: absolute;
      top: 0; bottom: 0;
      width: 1px;
      background: rgba(42, 58, 94, 0.3);
    }
    .today-marker {
      position: absolute;
      top: 0; bottom: 0;
      width: 2px;
      background: var(--status-red);
      z-index: 3;
      pointer-events: none;
    }
    .today-marker::before {
      content: 'TODAY';
      position: absolute;
      top: -20px;
      left: -16px;
      font-size: 9px;
      font-weight: 700;
      color: var(--status-red);
      letter-spacing: 0.5px;
    }
    .milestone-marker {
      position: absolute;
      top: 0; bottom: 0;
      width: 0;
      z-index: 1;
      pointer-events: none;
      border-left: 2px dashed rgba(255, 255, 255, 0.25);
    }

    /* ────────────────────────────────── Boulder popover (click) ────────────────────────────────── */
    .boulder-popover {
      position: fixed;
      z-index: 200;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px 12px 14px;
      width: 340px;
      max-width: calc(100vw - 24px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
    }
    .boulder-popover .pop-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: 0;
      color: var(--text-dim);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .boulder-popover .pop-close:hover { color: var(--text-bright); background: var(--bg-sidebar-hover); }
    .boulder-popover .pop-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-bright);
      margin: 0 22px 6px 0;
    }
    .boulder-popover .pop-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      font-size: 11.5px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .boulder-popover .pop-summary {
      color: var(--text);
      font-size: 12.5px;
      max-height: 220px;
      overflow-y: auto;
      margin: 0 0 10px 0;
    }
    .boulder-popover .pop-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .boulder-popover .pop-link-loading {
      color: var(--text-dim);
      font-size: 12px;
      font-style: italic;
    }
    .boulder-popover .pop-link-error {
      color: var(--text-dim);
      font-size: 11px;
      letter-spacing: 0.2px;
    }
    .boulder-popover .pop-link-caption {
      color: var(--text-dim);
      font-size: 11px;
    }
    .boulder-popover .pop-arrow {
      position: absolute;
      width: 12px; height: 12px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      border-top: 1px solid var(--border);
      transform: rotate(45deg);
    }
    .boulder-popover.flip-down .pop-arrow {
      top: -7px;
    }
    .boulder-popover:not(.flip-down) .pop-arrow {
      bottom: -7px;
      transform: rotate(225deg);
    }

    /* ────────────────────────────────── Sprint Plan (native) ────────────────────────────────── */
    /* Sprint header card — sprint name, dates, milestone progress, dropdown */
    .sprint-header-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 900px) { .sprint-header-card { grid-template-columns: 1fr; } }
    .sprint-header-left .sprint-h1 {
      font-size: 22px;
      color: var(--text-bright);
      font-weight: 600;
      margin: 0 0 4px 0;
    }
    .sprint-header-left .sprint-dates {
      color: var(--text-dim);
      font-size: 13px;
    }
    .sprint-header-left .sprint-holidays {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-dim);
      list-style: disc;
      padding-left: 18px;
    }
    .sprint-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 240px;
    }
    .sprint-milestone-name { font-size: 12px; color: var(--text-dim); }
    .sprint-milestone-bar {
      width: 220px;
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .sprint-milestone-bar-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.2s;
    }
    .sprint-milestone-meta { font-size: 11px; color: var(--text-dim); }
    .sprint-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .sprint-controls select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-bright);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .sprint-controls select:focus { outline: none; border-color: var(--accent); }

    /* Build Target — exec summary card with accent left-border */
    .build-target-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 16px;
    }
    .build-target-eyebrow {
      font-size: 10.5px;
      color: var(--accent);
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .build-target-headline {
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-bright);
      font-weight: 400;
      margin-bottom: 0;
    }

    /* Producer-grouped Goals — 3 columns */
    .goals-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 1100px) { .goals-3col { grid-template-columns: 1fr; } }
    .goal-producer-col { min-width: 0; }
    .goal-producer-name {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 10px;
    }
    .goal-producer-name strong { color: var(--text-bright); font-weight: 700; }
    .goal-pod-block + .goal-pod-block {
      border-top: 1px solid rgba(42, 58, 94, 0.4);
      padding-top: 8px;
      margin-top: 8px;
    }
    .goal-pod-block-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .goal-pod-block-header .pod-tag-sm { font-size: 9.5px; padding: 1px 6px; }
    .goal-pod-list {
      list-style: none;
      padding: 0 0 0 6px;
      margin: 0;
    }
    .goal-pod-list li {
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text);
      padding: 2px 0;
      position: relative;
      padding-left: 12px;
    }
    .goal-pod-list li::before {
      content: "·";
      color: var(--text-dim);
      position: absolute;
      left: 0;
      top: -2px;
      font-size: 16px;
    }

    /* Validation In Flight — slim, no panel framing, inline rows */
    .vif-section {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 14px;
      padding: 8px 4px 14px 4px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .vif-eyebrow {
      font-size: 10.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .vif-rows {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      flex: 1;
    }
    .vif-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      line-height: 1.3;
    }
    .vif-label { color: var(--text); }
    .shq-badge {
      font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
      font-size: 10.5px;
      background: rgba(83, 168, 255, 0.12);
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 3px;
    }

    /* ────────────────────────────────── Coming soon ────────────────────────────────── */
    .coming-soon {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }
    .coming-soon h2 { font-size: 22px; color: var(--text-bright); margin-bottom: 8px; }
    .coming-soon p { max-width: 520px; margin: 0 auto 16px auto; }

    /* ────────────────────────────────── Helper utilities ────────────────────────────────── */
    .stale-warning {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid var(--status-yellow);
      color: var(--status-yellow);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .info-banner {
      background: rgba(83,168,255,0.1);
      border: 1px solid rgba(83,168,255,0.4);
      color: var(--accent);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .small { font-size: 12px; color: var(--text-dim); }
    .meta-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .meta-row span strong { color: var(--text); font-weight: 600; }

    .feature-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }
    .feature-row:last-child { border-bottom: none; }
    .feature-row .drag-handle {
      color: var(--text-dim);
      cursor: grab;
      font-size: 14px;
      display: none;
    }
    body.edit-mode .feature-row .drag-handle { display: inline; }
    .feature-row .feature-rank {
      color: var(--text-dim);
      font-size: 12px;
      width: 24px;
      flex-shrink: 0;
    }
    .feature-row .feature-name {
      flex: 1;
      color: var(--text-bright);
      font-weight: 500;
    }

    .glossary-term { font-weight: 700; color: var(--accent); }

    /* Tight must-haves list inside the Current Milestone widget */
    .must-haves-summary {
      font-size: 11.5px;
      color: var(--text-dim);
      margin: 12px 0 6px 0;
    }
    .must-haves-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 6px;
    }
    .mh-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 12.5px;
      border-bottom: 1px solid var(--border);
    }
    .mh-row:last-child { border-bottom: none; }
    .mh-name { flex: 1; color: var(--text); line-height: 1.3; }
    .status-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }
    .status-dot.status-not_started { background: var(--status-gray); }
    .status-dot.status-in_progress { background: var(--status-blue); }
    .status-dot.status-complete    { background: var(--status-green); }
    .status-dot.status-blocked     { background: var(--status-red); }
    .status-dot.status-parked      { background: var(--pod-dozer); }
    .pod-tag-sm { font-size: 9.5px; padding: 1px 6px; line-height: 1.4; }
  </style>
</head>
